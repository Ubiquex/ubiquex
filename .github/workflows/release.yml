name: release

# Releases happen via tag push only -- never from a working session. Push a
# v* tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to run this.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # sdk/go, sdk/py, sdk/ts are real git submodules (.gitmodules).
          # ci.yml already carries this and explains why; release.yml
          # never got the same fix, so every tagged release since the
          # submodules landed has failed at "no matching versions for
          # query latest" on pyeval/tseval's own imports. Confirmed live
          # on the v0.3.0 tag, which produced no release at all.
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
