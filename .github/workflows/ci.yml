name: ci

# The one real gate this repo did not have: go build ./... and go test
# ./... on every push to main and every pull request. Found missing
# while UBI-220's own layout move accidentally surfaced a real,
# already-broken go build ./... on main (a tracked, pre-existing WIP
# snapshot in scratchpad/ mixed two package declarations in one
# directory, removed separately) -- nothing here had ever run a real,
# unscoped build or test on a push or a PR to notice.
#
# release.yml is this repo's only other workflow, and it triggers on a
# v* tag push only, never on push or pull_request, so it would not
# have caught this regardless of how often it ran. Its own build step
# also targets ./cmd/ubx specifically (the real binary entrypoint),
# never ./..., so it would not have traversed into a broken package
# like scratchpad's own that nothing real imports.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # First step, before checkout, because it needs nothing from the
      # repo and should fail in seconds rather than after a full build.
      #
      # This lives inside `build-test` rather than in a workflow of its
      # own so that it lands in the job branch protection already
      # requires on main. A separate job would need a
      # branch-protection change to become enforcing, and an advisory
      # check is exactly the thing that has already failed here.
      - name: The base branch is main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "main" ]; then
            echo "base is main"
            exit 0
          fi
          {
            echo "This PR targets \"$BASE\", not main."
            echo
            echo "A PR based on another branch merges into THAT branch. When the base"
            echo "merges to main first, GitHub retargets the dependent PR, but only if"
            echo "it gets there first. Twice in this repo it did not: the dependent PR"
            echo "merged into an already-dead base seconds later, showed MERGED, and its"
            echo "content never reached main. #99 was caught by accident and recovered by"
            echo "#100; #116 repeated it nine seconds after #115 landed, and was recovered"
            echo "by #117."
            echo
            echo "Nothing tells that apart from a real merge except an explicit ancestry"
            echo "check, and that check was already written down three times: in"
            echo "ubx-provider-runbook TRAPS.md, in this repo CLAUDE.md rule 8, and in the"
            echo "body of #116 itself, where the author committed to running it and"
            echo "stacked anyway. Writing it down is not what was missing."
            echo
            echo "Branch from main and open this against main. If it genuinely depends on"
            echo "unmerged work, wait for that to land and rebase onto main:"
            echo
            echo "    git rebase --onto main <old-base> <this-branch>"
            echo
            echo "If a non-main base is ever genuinely right here, change this step"
            echo "deliberately, in its own reviewed PR, rather than working around it."
          } >&2
          exit 1
      - name: Check out
        uses: actions/checkout@v4
        with:
          # sdk/go, sdk/py, sdk/ts are real git submodules (.gitmodules).
          # A plain checkout leaves them empty, which go build ./... then
          # reports as "no required module provides package ..." for
          # pyeval/tseval's own real imports -- caught live on this
          # workflow's own first real PR run, not assumed.
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod


      - name: go.mod and go.sum are tidy
        # Enforced here rather than fixed at release time. The release
        # config used to run `go mod tidy` as a before-hook, which
        # rewrote go.mod/go.sum during the build and stamped every
        # released binary -dirty via Go's own vcs.modified setting, while
        # goreleaser's own cleanliness check (which runs before its
        # hooks) saw nothing. It also meant the shipped binary was built
        # from dependency requirements nobody had reviewed.
        #
        # Failing here instead means drift surfaces on the PR that
        # introduces it, as a reviewable diff, rather than being applied
        # silently to a release.
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          if ! diff -u /tmp/go.mod.before go.mod || ! diff -u /tmp/go.sum.before go.sum; then
            echo
            echo "go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi
          echo "go.mod and go.sum are tidy"

      - name: Install bubblewrap, wasmtime and Deno
        # goeval's own real Linux sandbox is bubblewrap (docs/sdk.md's
        # own "Linux: namespaces (bwrap)" section); pyeval's own real
        # sandbox is wasmtime (docs/sdk.md's own "The Python evaluator:
        # decided empirically" section, WASI via wasmtime); tseval's own
        # evaluator is Deno. None of the three ships on the runner by
        # default -- caught live, not assumed,
        # by this workflow's own first real PR run failing blueprint's
        # own real evaluator tests with "executable file not found in
        # $PATH" for exactly these two.
        #
        # Found unblocking an unrelated PR, not tied to any ticket's own
        # content: wasmtime.dev's own install.sh hit a transient
        # upstream glitch (its own version-lookup
        # returned a literal, unsubstituted "{" instead of a real
        # version, so it tried to curl ".../download/{/wasmtime-{-...")
        # and printed "Error: Could not download Wasmtime version '{'"
        # but still exited 0 -- a real bug in wasmtime's own script, not
        # this repo's. Because it exited 0, `set -e` never caught it,
        # this whole step reported success, and the job ran another 20+
        # seconds of go test before failing three unrelated-looking
        # blueprint tests on "wasmtime not found in PATH" -- confusing
        # three steps downstream of the real cause. Verifying both
        # binaries actually landed, right after installing them, turns
        # that into an immediate, unambiguous failure at the step that
        # caused it, the next time this same upstream glitch happens.
        run: |
          set -euo pipefail
          # bubblewrap comes from the Ubuntu archive. The runner image
          # also carries third-party apt sources (Google Chrome's, among
          # others) that this repo neither needs nor controls, and
          # apt-get update fails the whole step when ANY configured
          # source fails. On 2026-09-09 the Chrome source served a
          # Packages.gz with a hash mismatch for hours, failing this
          # step with exit 100 on every PR and on main, across three
          # reruns 20 minutes apart, with nothing about it related to
          # bubblewrap.
          #
          # Treat an update error as a warning and let apt-get install
          # be the real gate: if the archive index is genuinely
          # unusable, the install below fails and the step fails with
          # it. Better to be unable to install bubblewrap than to be
          # unable to build because Chrome's mirror is having a bad
          # afternoon.
          #
          # Deleting the offending source list was tried first and is
          # deliberately NOT here: the file is not at the obvious
          # /etc/apt/sources.list.d/google-chrome.list on this image,
          # so the rm silently did nothing while looking like it
          # handled the case. Verified in a real run against the live
          # outage, where the Chrome fetch still failed and this
          # fallback is what carried the job green.
          if ! sudo apt-get update; then
            echo "apt-get update reported an error; continuing to the install, which is the real gate" >&2
          fi
          sudo apt-get install -y bubblewrap
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          # Deno was missing here until now, and nothing failed: every
          # test needing it calls its own requireDeno, which SKIPS when
          # it is absent rather than failing. So tseval's entire
          # real-subprocess suite, the one whose own doc comment says
          # its whole job is proving the real sandbox holds under a real
          # deno subprocess, has never run in CI at all -- a green check
          # that meant "not executed". Found while adding blueprint's
          # own TypeScript extractor tests, which would have landed in
          # the same hole.
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s -- --yes
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          if ! command -v bwrap >/dev/null 2>&1; then
            echo "bubblewrap did not install correctly -- bwrap not on PATH" >&2
            exit 1
          fi
          if [ ! -x "$HOME/.wasmtime/bin/wasmtime" ]; then
            echo "wasmtime did not install correctly -- $HOME/.wasmtime/bin/wasmtime missing or not executable (wasmtime.dev/install.sh can fail this way while still exiting 0, confirmed live)" >&2
            exit 1
          fi
          if [ ! -x "$HOME/.deno/bin/deno" ]; then
            echo "deno did not install correctly -- $HOME/.deno/bin/deno missing or not executable" >&2
            exit 1
          fi

      - name: Allow unprivileged user namespaces for bwrap
        # The exact caveat docs/sdk.md's own "Linux: namespaces" section
        # already documents: bwrap needs to create a new user + net
        # namespace, and current Ubuntu runner images restrict that by
        # default via AppArmor (bwrap: loopback: Failed RTM_NEWADDR:
        # Operation not permitted, caught live on this workflow's own
        # third real PR run). This is the standard, documented relaxation
        # for exactly this restriction, scoped to this job's own runner,
        # never a container-level privilege escalation.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: go build
        run: go build ./...

      - name: go test
        # -v so a skipped suite is visible in the log. Every evaluator
        # test skips rather than fails when its binary is absent (a
        # deliberate choice, see tseval's own requireDeno), which is
        # what let the whole TypeScript suite go unrun here unnoticed.
        run: go test -v ./... 2>&1 | tee /tmp/test.log; exit "${PIPESTATUS[0]}"

      - name: Report skipped tests
        # Never fails the build: skipping is legitimate for a test gated
        # on something this runner genuinely cannot provide. It is
        # printed so that "nothing ran" can never again look identical
        # to "everything passed".
        if: always()
        run: |
          echo "Skipped tests in this run:"
          grep -E "^(---|    ---) SKIP" /tmp/test.log || echo "  none"

      - name: Provider pins agree with what is committed and released
        # A snapshot travels through three places that can each move
        # alone: a schema repo's committed manifest, its latest release,
        # and the pin here. Nothing watched the gaps. UBI-249, found
        # during UBI-241: five of eight were stranded, three of them a
        # full major version merged but never published, for over a week.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 sdk/providers/check_pins.py
