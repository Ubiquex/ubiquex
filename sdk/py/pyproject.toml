[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ubx_sdk"
version = "0.1.0"
description = "ubx_sdk -- the describe-only Python runtime for Ubiquex SDK programs (stack/resource/secret/cross/intent)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Ubiquex" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ubiquex/ubiquex"
Documentation = "https://docs.ubiquex.io"

[tool.hatch.build.targets.wheel]
packages = ["ubx_sdk"]
exclude = ["ubx_sdk/test_runtime.py", "ubx_sdk/__pycache__"]

[tool.hatch.build.targets.sdist]
exclude = ["ubx_sdk/__pycache__"]
