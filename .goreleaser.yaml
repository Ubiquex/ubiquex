version: 2

project_name: ubx

# No `before: hooks: - go mod tidy`, deliberately.
#
# It used to run here and it is why v0.3.0's own released binary reported
# 0.3.0+5c6f8a2-DIRTY. Reproduced on a completely fresh recursive clone
# at that tag: git status is empty, then `go mod tidy` rewrites go.mod
# (-19 lines) and go.sum (-33 lines), and every binary compiled after
# that is stamped dirty by Go's own vcs.modified build setting.
#
# GoReleaser's own git-cleanliness validation runs BEFORE these hooks, so
# it saw a clean tree and raised nothing while its own hook dirtied it.
#
# Two real problems, not one cosmetic one. The -dirty suffix is the only
# field in the version string that answers "does this binary correspond
# to the commit it names", and this repo leans on exactly that
# distinction elsewhere (PROVENANCE.json's own dirty/unpushed fields,
# --require-clean-provenance). Firing it on every official release trains
# readers to ignore the one signal that is supposed to be rare. And
# tidying at release time means the shipped binary is built from
# dependency requirements that differ from what was committed and
# reviewed.
#
# Tidiness is enforced in ci.yml instead, where a diff fails the PR and
# can be reviewed, rather than being applied silently at release.

builds:
  - id: ubx
    main: ./cmd/ubx
    binary: ubx
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ubiquex/ubiquex/cli.Version={{ .Version }}
      - -X github.com/ubiquex/ubiquex/cli.Commit={{ .ShortCommit }}

archives:
  - id: ubx
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# GitHub Releases only -- no Homebrew tap, no Docker images. Deliberately
# no brews:/dockers:/etc. sections; adding a distribution channel is a
# decision to make later, not a default to fall into.

release:
  github:
    owner: Ubiquex
    name: ubiquex
  name_template: "v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^state:"
      - "^test:"

snapshot:
  # No commit suffix here -- ldflags already inject Commit separately (see
  # builds.ldflags above), and versionString() appends it once at runtime.
  # Embedding {{.ShortCommit}} in both places would double it up.
  version_template: "{{ .Tag }}-dev"
